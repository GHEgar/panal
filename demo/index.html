<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>panal demo</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <div id="map"></div>
        <aside class="panel">
            <h1>panal</h1>
            <label>Source
                <select id="source">
                    <option value="synthetic">20,000 synthetic points</option>
                    <option value="wfs">WFS sf:bugsites (gs-stable)</option>
                    <option value="wfs-worker">WFS sf:bugsites in the worker</option>
                    <option value="server">Simulated server (r3–r7)</option>
                </select>
            </label>
            <label class="check"><input id="worker" type="checkbox" /> Aggregate in a Web Worker</label>
            <label>Aggregation
                <select id="reducer">
                    <option value="count">Count</option>
                    <option value="sum">Sum</option>
                    <option value="mean">Mean</option>
                    <option value="min">Minimum</option>
                    <option value="max">Maximum</option>
                    <option value="range">Range (custom)</option>
                </select>
            </label>
            <label>Classification
                <select id="method">
                    <option value="quantile">Quantiles</option>
                    <option value="jenks">Jenks</option>
                    <option value="equalInterval">Equal intervals</option>
                    <option value="stdDev">Standard deviation</option>
                </select>
            </label>
            <label>Classes
                <input id="classes" type="range" min="2" max="7" value="5" />
            </label>
            <p id="status"></p>
            <ol id="legend"></ol>
            <section id="selection" hidden></section>
        </aside>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
